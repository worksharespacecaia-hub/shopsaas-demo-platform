name: pr-gate
# 觸發 ①：PR 掃描把關（第 5.5 節）。只用工具，不用 LLM。不可改用 pull_request_target。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取出受保護 base SHA 的把關程式與規則
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid base sha"; exit 2; }
          mkdir -p "$RUNNER_TEMP/gate"
          git show "$BASE_SHA:scripts/pr_gate.py" > "$RUNNER_TEMP/gate/pr_gate.py"

      - name: Checkov（有改 Terraform 時，只列出不阻擋）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -q '^infra/terraform/'; then
            pip install --quiet checkov==3.2.0
            mkdir -p pr-gate-out
            checkov -d infra/terraform --quiet --compact -o json > pr-gate-out/checkov.json || true
          fi

      - name: 執行把關（Trivy、Gitleaks、規則檢查）
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCANNER_MODE: docker
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
          TRIVY_IMAGE: aquasec/trivy:0.57.1
          OUT_DIR: pr-gate-out
        run: python3 "$RUNNER_TEMP/gate/pr_gate.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-gate-out/
          if-no-files-found: ignore

      - name: PR 留言（best effort；Fork PR 可能沒有權限）
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pr-gate-out/comment.md';
            if (!fs.existsSync(path)) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: fs.readFileSync(path, 'utf8'),
            });
